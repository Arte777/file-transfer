<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Пометки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=238">
</head>
<body>
  <div class="sidebar-layout">
    <div id="sidebarSlot"></div>
    
    <main class="main-content">
      <div class="top-bar">
        <div>
          <h1 class="page-title">Пометки</h1>
          <p class="page-subtitle" style="margin-top: 4px; font-size: 0.82rem; color: var(--text-secondary);">Группировка аккаунтов по меткам режимов (MM2, Adopt Me, Steal a Brainrot)</p>
        </div>
      </div>

      <div class="container">
        <!-- Stats bar for game categories -->
        <div class="stats-bar" style="margin-bottom: 1.25rem;">
          <div class="stat-card">
            <div class="stat-label">Всего помечено</div>
            <div class="stat-value" id="sTotal">—</div>
          </div>
          
          <div class="stat-card">
            <div class="stat-label">Murder Mystery 2</div>
            <div class="stat-value" id="sMM2" style="color: #f43f5e;">—</div>
          </div>
          
          <div class="stat-card">
            <div class="stat-label">Adopt Me</div>
            <div class="stat-value" id="sAdopt" style="color: #f59e0b;">—</div>
          </div>
          
          <div class="stat-card">
            <div class="stat-label">Steal a Brainrot</div>
            <div class="stat-value" id="sBrainrot" style="color: #a855f7;">—</div>
          </div>
        </div>

        <div id="bookmarksContainer">
          <div class="skeleton-row"><div class="skeleton-block" style="flex:1;"></div></div>
          <div class="skeleton-row"><div class="skeleton-block" style="flex:1;"></div></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Tag & Notes Modal -->
  <div id="tagModal" class="modal-overlay" onclick="closeTagModal()">
    <div class="modal-container tag-modal-box" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeTagModal()" aria-label="Закрыть">✕</button>
      <div class="tag-modal-header">
        <div class="tag-modal-avatar" id="tagModalAvatar">👤</div>
        <div>
          <h3 class="tag-modal-title" id="tagModalTitle">Пометки аккаунта</h3>
          <div class="tag-modal-subtitle" id="tagModalSubtitle">Настройте метки игр и заметку к аккаунту</div>
        </div>
      </div>
      <div class="tag-modal-body">
        <div class="tag-modal-section-title">Игровые пометки</div>
        <div class="game-tags-list" id="tagModalGames"></div>
        
        <div class="tag-modal-section-title" style="margin-top: 1.25rem;">Заметка к аккаунту</div>
        <div style="position: relative;">
          <input type="text" id="tagModalNote" class="settings-input" placeholder="Например: Мейн, Твинк 2, Нож Батвинг..." maxlength="50" style="padding-right: 70px;">
          <button class="btn-primary" id="tagModalSaveNote" onclick="saveTagModalNote()" style="position: absolute; right: 4px; top: 4px; bottom: 4px; padding: 0 12px; font-size: 0.78rem;">ОК</button>
        </div>
      </div>
      <div class="tag-modal-footer">
        <button class="btn-secondary" onclick="closeTagModal()" style="width: 100%;">Готово</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="assets/config.js?v=236"></script>
  <script src="assets/app.js?v=238"></script>
  <script src="assets/bookmarks.js?v=236"></script>
</body>
</html>
