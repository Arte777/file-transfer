<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NEXUS — Релизы и обновления</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=120">
</head>
<body>
  <div class="sidebar-layout">
    <div id="sidebarSlot"></div>
    <main class="main-content">
      <div class="container" style="max-width: 860px;">
        <div class="top-bar">
          <h1 class="page-title">Сборки и обновления</h1>
        </div>
        
        <!-- Актуальный релиз -->
        <div class="update-hero-card" id="heroDownloadCard">
          <div class="stat-label" style="justify-content: center; margin-bottom: 0.25rem;">Актуальная версия</div>
          <div class="update-hero-version" id="heroVersion">Загрузка...</div>
          <p class="update-hero-desc">Выберите и скачайте необходимую сборку для вашего оператора.</p>
          
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.8rem; width: 100%;">
            <!-- RAH -->
            <div style="background: #18181b; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; text-align: center; display:flex; flex-direction:column; justify-content:space-between;">
              <div style="font-weight: 600; color: #a29bfe; font-size: 0.88rem; margin-bottom: 0.75rem; text-transform: uppercase;">Сборка RAH (Shonll)</div>
              <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <a href="#" id="btnDownloadRahClient" class="download-hero-btn" style="background: #6c5ce7;" target="_blank" download>
                  NON PRO
                </a>
                <a href="#" id="btnDownloadRahStandalone" class="download-hero-btn" style="background: transparent; border: 1px solid var(--border); color: #a29bfe;" target="_blank" download>
                  PRO
                </a>
              </div>
            </div>
            
            <!-- FIRE -->
            <div style="background: #18181b; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; text-align: center; display:flex; flex-direction:column; justify-content:space-between;">
              <div style="font-weight: 600; color: #00cec9; font-size: 0.88rem; margin-bottom: 0.75rem; text-transform: uppercase;">Сборка FIRE (Dildman)</div>
              <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <a href="#" id="btnDownloadFireClient" class="download-hero-btn" style="background: #00cec9; color: #000;" target="_blank" download>
                  NON PRO
                </a>
                <a href="#" id="btnDownloadFireStandalone" class="download-hero-btn" style="background: transparent; border: 1px solid var(--border); color: #00cec9;" target="_blank" download>
                  PRO
                </a>
              </div>
            </div>

            <!-- SVYAZ -->
            <div style="background: #18181b; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; text-align: center; display:flex; flex-direction:column; justify-content:space-between;">
              <div style="font-weight: 600; color: #c084fc; font-size: 0.88rem; margin-bottom: 0.75rem; text-transform: uppercase;">Сборка SVYAZ</div>
              <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <a href="#" id="btnDownloadSvyazClient" class="download-hero-btn" style="background: #a855f7;" target="_blank" download>
                  NON PRO
                </a>
                <a href="#" id="btnDownloadSvyazStandalone" class="download-hero-btn" style="background: transparent; border: 1px solid var(--border); color: #c084fc;" target="_blank" download>
                  PRO
                </a>
              </div>
            </div>
          </div>
        </div>

        <!-- Журнал версий -->
        <h2 class="settings-section-title" style="margin-bottom: 1.25rem;">История изменений</h2>
        <div class="changelog-container" id="changelogList">
          <div class="skeleton-row" style="height: 80px;">
            <div class="skeleton-block" style="flex:1;"></div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <div id="toast"></div>

  <script src="assets/config.js?v=120"></script>
  <script src="assets/app.js?v=120"></script>
  <script src="assets/updates.js?v=120"></script>
</body>
</html>
