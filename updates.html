<!DOCTYPE html>
<html lang="ru">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NEXUS — Релизы и обновления</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=132">
</head>
<body>
  <div class="sidebar-layout">
    <div id="sidebarSlot"></div>
    <main class="main-content">
      <div class="container" style="max-width: 860px;">
        <div class="top-bar">
          <h1 class="page-title">Сборки и обновления</h1>
        </div>
        
        <!-- Актуальный релиз -->
        <div class="update-hero-card" id="heroDownloadCard">
          <div class="stat-label" style="justify-content: center; margin-bottom: 0.25rem;">Ваша персональная сборка</div>
          <div class="update-hero-version" id="heroVersion">Загрузка...</div>
          <p class="update-hero-desc" id="heroBuildDesc">Сборка сконфигурирована специально для вашего профиля.</p>
          
          <div id="heroBuildContainer" style="width: 100%; max-width: 520px; margin: 0 auto;">
            <!-- Вставляется динамически для текущего профиля -->
          </div>

          <!-- Админ-панель для Shonll (Root Admin) -->
          <div id="adminAllBuildsPanel" style="display: none; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); width: 100%;">
            <div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 700; margin-bottom: 0.75rem;">
              Панель администратора: Все доступные сборки
            </div>
            <div id="adminAllBuildsGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.8rem; width: 100%;">
            </div>
          </div>
        </div>

        <!-- Журнал версий -->
        <h2 class="settings-section-title" style="margin-bottom: 1.25rem;">История изменений</h2>
        <div class="changelog-container" id="changelogList">
          <div class="skeleton-row" style="height: 80px;">
            <div class="skeleton-block" style="flex:1;"></div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <div id="toast"></div>

  <script src="assets/config.js?v=132"></script>
  <script src="assets/app.js?v=132"></script>
  <script src="assets/updates.js?v=132"></script>
</body>
</html>
